[project]
name = "pokemon-tcg-mcp-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastmcp>=3.4.5",
    "motor>=3.7.1",
    "pydantic>=2.13.4",
    "pymongo>=4.17.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[project.scripts]
pokemon_tcg_mcp_server = "pokemon_tcg_mcp_server.server:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["src/pokemon_tcg_mcp_server/tests"]
# Integration tests need a live MongoDB, so they are opt-in: run them with
# `pytest -m integration`.
addopts = "-m 'not integration' --strict-markers"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that require external services (e.g. a live MongoDB connection)",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.16.0",
]
